services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aqua
      POSTGRES_PASSWORD: aqua
      POSTGRES_DB: aquasuivi
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aqua']
      interval: 5s
      retries: 10
volumes:
  pgdata:
